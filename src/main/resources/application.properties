spring.application.name=bookstore-backend

# Opt-in administrator provisioning; also supports uppercase keys in the imported .env.
app.admin.bootstrap.enabled=${APP_ADMIN_BOOTSTRAP_ENABLED:false}
app.admin.bootstrap.email=${APP_ADMIN_BOOTSTRAP_EMAIL:}
app.admin.bootstrap.username=${APP_ADMIN_BOOTSTRAP_USERNAME:Administrator}
app.admin.bootstrap.password=${APP_ADMIN_BOOTSTRAP_PASSWORD:}

# Read the backend's local .env when running from the backend project folder.
spring.config.import=optional:file:./.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:bookstore}
spring.datasource.username=${POSTGRES_USER:bookstore}
spring.datasource.password=${POSTGRES_PASSWORD}

# Flyway manages schema changes; Hibernate checks that entity mappings match.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Reject fractional JSON numbers for integer fields instead of silently truncating them.
spring.jackson.deserialization.accept-float-as-int=false

app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
