spring.application.name=bookstore-backend

# Read the backend's local .env when running from the backend project folder.
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:bookstore}
spring.datasource.username=${POSTGRES_USER:bookstore}
spring.datasource.password=${POSTGRES_PASSWORD}

# Schema migrations will be added with the product data model.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
